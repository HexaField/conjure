name: build-static

on:
  pull_request:
    branches: [dev]

jobs:
  secrets-gate:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check-secrets.outputs.ok }}
    steps:
      - name: check for secrets needed to run workflows
        id: check-secrets
        run: |
          if [ ${{ secrets.STATIC_BUILD_ENABLED }} == 'true' ]; then
            echo "ok=enabled" >> $GITHUB_OUTPUT
          fi
  build:
    needs:
      - secrets-gate
    if: ${{ needs.secrets-gate.outputs.ok == 'enabled'}}
    environment:
      name: '${{ github.repository }}-static-build-gh-pages'
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: lowercase github.repository
        run: |
          echo "REPO_NAME=`echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]'`" >>${GITHUB_ENV}
      - name: Checkout Infinite Reality Engine
        uses: actions/checkout@v3
        with:
          repository: enchantmentengine/enchantmentengine
          ref: dev
      - name: Checkout Project
        uses: actions/checkout@v3
        with:
          path: './packages/projects/projects/${{ env.REPO_NAME }}'
      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22.x
      - name: restore lerna
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            */*/node_modules
            package-lock.json
          key: ${{ runner.os }}-branch-build-${{ hashFiles('**/package.json') }}
      - run: cp .env.local.default .env.local
      - run: mkdir -p packages/projects/projects/enchantmentengine/default-project && cp -r packages/projects/default-project/. packages/projects/projects/enchantmentengine/default-project
      - run: npm install --production=false --loglevel notice
      - run: cd './packages/projects/projects/${{ env.REPO_NAME }}' && npx cross-env STATIC_BUILD_HOST=${{ secrets.STATIC_BUILD_HOST }} npm run build



